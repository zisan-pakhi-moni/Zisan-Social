
name: Build Zisan Social APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'google-services.json'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir source
          unzip -q ZisanSocial_AndroidStudio_Repaired.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -type f | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          cp "$GITHUB_WORKSPACE/google-services.json" app/google-services.json
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Zisan-Social-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          
