name: Build Zisan Social APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'google-services.json'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Extract project
        run: |
          mkdir source
          unzip -q ZisanSocial_AndroidStudio_Repaired.zip -d source
          PROJECT_DIR=$(find source -name gradlew -type f | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p app
          cp "$GITHUB_WORKSPACE/google-services.json" app/google-services.json
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Zisan-Social-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
