
name: Build Zisan Social APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'google-services.json'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android Project
        run: |
          mkdir source
          unzip -q ZisanSocial_AndroidStudio_Repaired.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -type f -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Add Firebase Config
        run: |
          test -f google-services.json
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zisan-Social-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
